<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Smart Grid IDS Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .error-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            text-align: center;
        }

        .error-icon {
            font-size: 4rem;
            color: #e74c3c;
            margin-bottom: 20px;
        }

        .error-card h1 {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .error-card p {
            color: #7f8c8d;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .error-code {
            background: #f8f9fa;
            border-left: 4px solid #e74c3c;
            padding: 15px;
            margin: 20px 0;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            color: #555;
            word-break: break-all;
        }

        .btn-home {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 10px 30px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .btn-home:hover {
            color: white;
            text-decoration: none;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">
            <i class="fas fa-exclamation-circle"></i>
        </div>
        <h1>Oops!</h1>
        <p>Something went wrong while loading the dashboard.</p>
        
        {% if error %}
        <div class="error-code">
            Error: {{ error }}
        </div>
        {% endif %}

        <p style="font-size: 0.9rem; color: #95a5a6;">
            <i class="fas fa-lightbulb"></i>
            Please try refreshing the page, or ensure that all IDS services are running properly.
        </p>

        <a href="/" class="btn-home">
            <i class="fas fa-home"></i> Return to Dashboard
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
